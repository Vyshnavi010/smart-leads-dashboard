
services:
  mongodb:
    image: mongo:latest
    container_name: smart-leads-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-leads-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart-leads-db
      - JWT_SECRET=docker_compose_secret_leads_key
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-leads-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
